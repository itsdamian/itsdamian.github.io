<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林書弘 Damian Lin - Senior Software Engineer</title>
    <meta name="description" content="林書弘 Damian Lin 的個人履歷 - 資深軟體工程師，專精於後端系統、全端交付、AI 整合與基礎設施維運">
    <meta name="color-scheme" content="dark light">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) {}
            document.documentElement.setAttribute('data-theme', stored || 'dark');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <canvas id="field" aria-hidden="true"></canvas>

    <header class="bar">
        <button class="bar-more" id="more-btn" aria-expanded="false" aria-controls="more-panel">more</button>
        <span class="bar-line"></span>
        <nav class="bar-nav" id="nav" aria-label="Primary"></nav>
    </header>

    <div class="more-panel" id="more-panel" hidden>
        <div class="more-group">
            <span class="more-label">lang</span>
            <button class="opt" data-lang="zh">中文</button>
            <button class="opt" data-lang="en">English</button>
        </div>
        <div class="more-group">
            <span class="more-label">theme</span>
            <button class="opt" data-theme-set="dark">dark</button>
            <button class="opt" data-theme-set="light">light</button>
        </div>
        <div class="more-group">
            <span class="more-label">links</span>
            <a class="opt" href="https://github.com/itsdamian" target="_blank" rel="noopener">github</a>
            <a class="opt" href="mailto:greetinitsdamian@gmail.com">email</a>
        </div>
    </div>

    <main id="view" tabindex="-1"></main>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>

</html>
